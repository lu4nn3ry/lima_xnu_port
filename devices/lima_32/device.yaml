# Descrição do alvo `lima_32`.
#
# REGRAS DESTE ARQUIVO
#   1. Todo campo tem `status`: verified | user | public | conflict | unknown
#      user   = relato do usuário, ainda sem confirmação por comando
#   2. Todo campo `verified` tem `source` com o comando e a saída resumida.
#   3. Nada é copiado de outro dispositivo.
#   4. `null` significa "não sabemos", não "não existe".

schema: 1
updated: "2026-11-10"          # data da última verificação (AAAA-MM-DD)

identity:
  vendor: Motorola
  marketing_name: Moto G8 Play
  model_code:
    value: XT2015-2
    status: verified
    source: "fastboot getvar sku / carrier_sku -> XT2015-2"
  codename:
    value: lima_32          # build lima_32_retail
    status: verified
    source: "fastboot getvar version-bootloader -> MBM-2.1-lima_32_retail-b64a50bf6-211028"
  region: retbr
  launch_android: "9"
  current_android:
    value: "10"
    status: verified
    source: "fastboot getvar ro.build.fingerprint -> 10/QMDS30.47-33-5"
  current_rom: oficial (OTA Motorola)
  build_fingerprint:
    value: "motorola/lima_32/lima:10/QMDS30.47-33-5/7e278:user/release-keys"
    status: verified
    source: "fastboot getvar ro.build.fingerprint"

soc:
  vendor: MediaTek
  name:
    value: MT6771V/WL       # Helio P70M / P60 family
    status: verified
    source: "fastboot getvar cpu -> MT6771V/WL"
    note: >
      Confirmado como MT6771V/WL diretamente pelo bootloader. Conflito com MT6765
      resolvido definitivamente.
  platform_string: MT6771_V70.02.01.113R     # version-baseband
  cpu_topology: 4xA73 + 4xA53
  gpu: Mali-G72 MP3

memory:
  ram_bytes:
    value: 2147483648       # 2 GiB
    status: verified
    source: "fastboot getvar ram -> 2GB SAMSUNG LP4x DIE=16Gb"
  dram_base: null
  reserved_regions_known: false

storage:
  type: emmc
  version: "5.1"
  size_bytes: 34359738368   # 32 GiB
  source: "fastboot getvar emmc -> 32GB SAMSUNG 4X6KMB"
  gpt_known: true
  source_gpt: "adb shell ls -l /dev/block/by-name -> 63 particoes"
  slots: a_b               # slot-count: 2, current-slot: a

display:
  width:
    value: 720
    status: verified
    source: "adb getevent -p (mtk-tpd ABS_X max 720)"
  height:
    value: 1520
    status: verified
    source: "adb getevent -p (mtk-tpd ABS_Y max 1520)"
  panel_model: null
  dsi_controller: "dsi0@14014000"
  framebuffer_left_by_bootloader: null

input:
  touch_controller: ilitek
  touch_bus: i2c
  touch_irq_gpio: "mt-eint 6"
  power_key: "mt6358-irq 48, 50"
  keypad: "mtk-kpd MT_SYSIRQ 186"

logging:
  uart_available: true
  uart_controller: "serial@11002000 (ttyS0, MT_SYSIRQ 91)"
  pstore_available: null
  chosen_channel: uart0

bootloader:
  unlocked:
    value: true
    status: verified
    source: "fastboot getvar securestate -> flashing_unlocked"
  unlocked_via: "portal oficial Motorola via fastboot oem unlock com Unique Key"
  verified_boot_state: null # ro.boot.verifiedbootstate (esperado orange)
  avb_enforcing: null
  fastboot_boot_unsigned: null
  bootloader_version: "MBM-2.1-lima_32_retail-b64a50bf6-211028"

phase:
  current: 0
  writes_performed_on_device: false
  backups:
    taken: false
    verified: false
    locations: []
