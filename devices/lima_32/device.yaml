# Descrição do alvo `lima_32`.
#
# REGRAS DESTE ARQUIVO
#   1. Todo campo tem `status`: verified | user | public | conflict | unknown
#      user   = relato do usuário, ainda sem confirmação por comando
#   2. Todo campo `verified` tem `source` com o comando e a saída resumida.
#   3. Nada é copiado de outro dispositivo.
#   4. `null` significa "não sabemos", não "não existe".

