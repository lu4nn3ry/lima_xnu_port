    status: user
    source: relato do usuario em 2026-11-10
  codename:
    value: lima_32          # usado pelo projeto; confirmar string do Android
    status: unknown
    source: null            # ro.product.device / ro.build.product
  region: null
  launch_android: "9"
  current_android:
    value: "10"
    status: user
    source: relato do usuario em 2026-11-10
  current_rom: null         # oficial (OTA) ou custom
  build_fingerprint:
